# Render blueprint: one free web service for the backend.
# The Gemini key is NOT stored here. Set GEMINI_API_KEY (and optionally GEMINI_MODEL) in the Render dashboard.
services:
  - type: web
    name: spinalytics-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173 # replace with the Vercel address after the first frontend deploy
      - key: GEMINI_API_KEY
        sync: false # secret: enter it in the dashboard
      - key: GEMINI_MODEL
        sync: false
